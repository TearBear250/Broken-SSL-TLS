# HAProxy — Hardened TLS 1.2 Fallback Configuration
#
# Purpose:  Prefer TLS 1.3; allow a locked-down TLS 1.2 fallback.
# Requires: HAProxy 2.2+ (for ssl-min-ver / ssl-max-ver syntax).
#           HAProxy 2.6+ recommended for best TLS 1.3 support.
#
# External cipher list files (stored alongside this file):
#   configs/haproxy-tls12-ciphers.txt     — TLS 1.2 ECDHE+AEAD cipher list
#   configs/haproxy-tls13-ciphersuites.txt — TLS 1.3 suite list
#
# Copy those files to /etc/haproxy/ and adjust the paths in the bind line.

global
    # Use a newer TLS library and avoid legacy settings.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_256_GCM_SHA384

    # Tune SSL session cache (server-side resumption without tickets).
    tune.ssl.cachesize 20000
    tune.ssl.lifetime  300

defaults
    mode    http
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    option  forwardfor
    option  http-server-close

# ---------------------------------------------------------------------------
# HTTPS frontend
# ---------------------------------------------------------------------------
frontend fe_https
    bind :443 ssl crt /etc/haproxy/certs/site.pem \
        ssl-min-ver TLSv1.2 \
        ssl-max-ver TLSv1.3 \
        ciphers @/etc/haproxy/tls12-ciphers.txt \
        ciphersuites @/etc/haproxy/tls13-ciphersuites.txt \
        curves X25519:P-256 \
        no-tls-tickets

    # Remove if you use HAProxy for TCP pass-through rather than HTTP.
    http-request redirect scheme https unless { ssl_fc }

    # HSTS: tell browsers to use HTTPS for 2 years (requires mode http).
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains"

    default_backend be_app

# HTTP frontend — redirect to HTTPS
frontend fe_http
    bind :80
    http-request redirect scheme https code 301

# ---------------------------------------------------------------------------
# Backend (adjust to your application servers)
# ---------------------------------------------------------------------------
backend be_app
    balance roundrobin
    server app1 127.0.0.1:8080 check

# ---------------------------------------------------------------------------
# Notes
# ---------------------------------------------------------------------------
# no-tls-tickets
#   Disables TLS session tickets on this bind.  Session tickets can leak
#   forward-secrecy if the ticket encryption key is not rotated frequently.
#   Use server-side session cache (tune.ssl.cachesize above) for resumption.
#
# curves X25519:P-256
#   X25519 is the preferred elliptic curve (fast, constant-time, modern).
#   P-256 (secp256r1) is the widely-supported NIST fallback.
#
# ssl-min-ver TLSv1.2 / ssl-max-ver TLSv1.3
#   Enforces the protocol range.  SSLv3, TLS 1.0, and TLS 1.1 are rejected.
