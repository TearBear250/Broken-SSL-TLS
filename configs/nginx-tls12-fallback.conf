# Nginx — Hardened TLS 1.2 Fallback Configuration
#
# Purpose:  Prefer TLS 1.3; allow a locked-down TLS 1.2 fallback.
# Requires: Nginx 1.13.0+ (for TLS 1.3 support) and OpenSSL 1.1.1+.
#
# Drop this snippet inside your server { } block (port 443).
# Adjust ssl_certificate / ssl_certificate_key paths to match your setup.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name example.com;

    # --- Certificate and key -------------------------------------------------
    # Provide at least an RSA certificate.
    # For best performance with modern clients, also supply an ECDSA certificate
    # (dual-cert setup); Nginx will automatically select the right one.
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # Optional: ECDSA dual certificate (uncomment if available)
    # ssl_certificate     /etc/nginx/tls/ecdsa-fullchain.pem;
    # ssl_certificate_key /etc/nginx/tls/ecdsa-privkey.pem;

    # --- Protocol versions ---------------------------------------------------
    # TLS 1.3 is preferred; TLS 1.2 is the only allowed fallback.
    # SSLv2, SSLv3, TLS 1.0, and TLS 1.1 are NOT listed and therefore disabled.
    ssl_protocols TLSv1.3 TLSv1.2;

    # --- TLS 1.3 cipher suites -----------------------------------------------
    # TLS 1.3 suites are negotiated separately from TLS 1.2 in OpenSSL/Nginx.
    # All three are AEAD and considered strong; order reflects preference.
    # Requires Nginx 1.19.4+ and OpenSSL 1.1.1+ for ssl_conf_command.
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_256_GCM_SHA384;

    # --- TLS 1.2 cipher suites (ECDHE + AEAD only) ---------------------------
    # No RSA key exchange (no forward secrecy).
    # No CBC mode (padding oracle / LUCKY13 / BEAST risk).
    # No 3DES, RC4, EXPORT, or NULL suites.
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Prefer server cipher order so the list above is honoured.
    ssl_prefer_server_ciphers on;

    # --- Key exchange curves / groups ----------------------------------------
    # X25519: fast, modern, constant-time.
    # secp256r1 (P-256): widely-supported NIST fallback.
    # Requires OpenSSL 1.1.0+ for X25519.
    ssl_ecdh_curve X25519:secp256r1;

    # --- Session tickets ------------------------------------------------------
    # Disabled by default for forward-secrecy hygiene.
    # If you require session resumption for performance, rotate ticket keys
    # every few hours using ssl_session_ticket_key with a managed key file,
    # and do not persist keys across restarts.
    ssl_session_tickets off;

    # Session cache (server-side, avoids full handshake on reconnect):
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- OCSP stapling -------------------------------------------------------
    # Allows the server to send a pre-fetched OCSP response so clients
    # do not need to contact the CA directly during the handshake.
    # Requires a working resolver (e.g., your local DNS or 1.1.1.1).
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/tls/chain.pem;  # CA chain, not leaf cert
    resolver            1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout    5s;

    # --- HSTS (HTTP Strict Transport Security) --------------------------------
    # Instructs browsers to use HTTPS for this domain for 2 years.
    # Add preload only after testing; removing is difficult once preloaded.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- Application ----------------------------------------------------------
    location / {
        # proxy_pass http://backend; # or serve static files, etc.
    }
}

# HTTP → HTTPS redirect (optional but recommended)
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}
