# Apache HTTPD — Hardened TLS 1.2 Fallback Configuration
#
# Purpose:  Prefer TLS 1.3; allow a locked-down TLS 1.2 fallback.
# Requires: Apache 2.4.36+ and OpenSSL 1.1.1+.
#           mod_ssl must be loaded (LoadModule ssl_module modules/mod_ssl.so).
#
# Drop this inside a <VirtualHost *:443> block.
# Adjust SSLCertificateFile / SSLCertificateKeyFile paths as needed.

<VirtualHost *:443>
    ServerName example.com

    # --- Certificate and key -------------------------------------------------
    SSLEngine on
    SSLCertificateFile    /etc/apache2/tls/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/tls/privkey.pem

    # Optional: ECDSA certificate for dual-cert setups (Apache 2.4.36+)
    # SSLCertificateFile    /etc/apache2/tls/ecdsa-fullchain.pem
    # SSLCertificateKeyFile /etc/apache2/tls/ecdsa-privkey.pem

    # --- Protocol versions ---------------------------------------------------
    # TLS 1.3 is preferred; TLS 1.2 is the only allowed fallback.
    # The -all prefix disables ALL protocols, then we re-enable only 1.2 + 1.3.
    SSLProtocol             -all +TLSv1.2 +TLSv1.3

    # --- TLS 1.2 cipher suites (ECDHE + AEAD only) ---------------------------
    # Excludes: RSA Kx, CBC mode, 3DES, RC4, EXPORT, NULL, anonymous suites.
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:\
ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:\
ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384

    # Prefer the server's cipher order over the client's.
    SSLHonorCipherOrder     on

    # --- TLS 1.3 cipher suites -----------------------------------------------
    # Requires Apache 2.4.36+ / mod_ssl linked against OpenSSL 1.1.1+.
    # These three are the standard TLS 1.3 AEAD suites.
    SSLOpenSSLConfCmd       Ciphersuites TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_256_GCM_SHA384

    # --- Key exchange curves / groups ----------------------------------------
    # X25519 is preferred (fast, modern, constant-time).
    # secp256r1 (P-256) is a well-supported NIST fallback.
    # Requires OpenSSL 1.1.0+ for X25519.
    SSLOpenSSLConfCmd       Curves X25519:secp256r1

    # --- TLS compression -----------------------------------------------------
    # Disabled to prevent CRIME (CVE-2012-4929).
    # Modern OpenSSL defaults to off; this makes it explicit.
    SSLCompression          off

    # --- Session tickets ------------------------------------------------------
    # Disabled for forward-secrecy hygiene.
    # If you require session tickets, implement key rotation and do not persist
    # ticket keys across server restarts.
    SSLSessionTickets       off

    # --- OCSP stapling -------------------------------------------------------
    # Pre-fetches and caches the OCSP response so clients do not need to
    # contact the CA directly. Requires SSLUseStapling and a staple cache.
    # Uncomment and configure the cache directive in your server-level config:
    #   SSLStaplingCache shmcb:/var/run/apache2/stapling-cache(128000)
    # SSLUseStapling on

    # --- HSTS (HTTP Strict Transport Security) --------------------------------
    # Requires mod_headers.
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

    # --- Application ----------------------------------------------------------
    DocumentRoot /var/www/html
    # Or use ProxyPass / ProxyPassReverse for a reverse-proxy setup.

</VirtualHost>

# HTTP → HTTPS redirect (optional but recommended)
<VirtualHost *:80>
    ServerName example.com
    Redirect permanent / https://example.com/
</VirtualHost>
